<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gegenprobe · Not found</title>
<style>
/* Served by Cloudflare static assets with HTTP 404 for any path that is not a file (deploy/site/wrangler.jsonc,
   not_found_handling "404-page"). Self-contained: no font or script request, so it renders at any depth. */
:root { --paper: #f6f6f4; --ink: #101010; --ink-2: #4a4a47; --rule: #10101026; --red: #e2001a;
  --display: "Helvetica Neue", Helvetica, Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --paper: #0d0d0c; --ink: #eeeee9; --ink-2: #b4b4ae; --rule: #eeeee92b; --red: #ff3347; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 15px;
  line-height: 1.45; padding: 48px clamp(16px, 2.4vw, 32px); }
main { max-width: 64ch; border-top: 2px solid var(--ink); padding-top: 16px; }
.label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-size: 28px; line-height: 1.15; margin: 8px 0 16px; font-weight: 600; }
p { margin: 0 0 12px; overflow-wrap: anywhere; }
code { font-family: var(--mono); font-size: 13px; }
a { color: inherit; text-underline-offset: 3px; }
a:hover { color: var(--red); }
.red { color: var(--red); }
</style>
</head>
<body>
<main>
  <div class="label"><span class="red">404</span> · Gegenprobe evidence viewer</div>
  <h1>No file at this address.</h1>
  <p>The path <code id="p">requested</code> is not part of the site. Downloads live under <code>/downloads/</code> with
    the exact file names listed in the OPD box of the viewer.</p>
  <p><a href="/">Open the evidence viewer</a> · <a href="https://github.com/mi11ione/gegenprobe">Repository</a></p>
</main>
<script>document.getElementById('p').textContent = location.pathname;</script>
</body>
</html>
