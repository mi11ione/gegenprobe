name: arms-8b-p2
# The real Apertus v1.5 8B (GGUF Q4_K_M, llama.cpp CPU) on P2's 62 documents from 15 parliaments without rules: arms rules,
# pointer, cascade, through the frozen eval.arms.run staged exactly as eval/gold2/run_p2.py, with the fast scorer that
# cleared the D2 gate (results/eval/gguf_fast_verparity.json) and the committed 8B θ (P1 dev fit, unchanged).
# Six shards sliced on the full P2 label order (eval/run_arms_p2.py); job `merge` concatenates them and scores with the
# frozen P2 scorer + hypotheses script. Commit the artifact `p2-8b` (results + model cache) after review.
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: track_2a
env:
  GP_WORK: ${{ github.workspace }}/work
  PYTHONPATH: src:.
jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: {i: [0, 1, 2, 3, 4, 5]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-fra tesseract-ocr-ita
      - run: |
          pip install --require-hashes -r requirements.lock   # same pins as requirements.txt, sha256-verified
          pip install --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.35 \
            || CMAKE_ARGS="-DGGML_NATIVE=ON" pip install llama-cpp-python==0.3.35
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: {path: "${{ github.workspace }}/work/models", key: model-cache-apertus-8b-gguf-v1}
      - run: python -c "from gegenprobe import llm; print(llm.fetch_gguf('apertus-v1.5-8b-text-q4_k_m'))"   # sha256-verified
      - run: python -m eval.run_arms_p2 fetch
      - run: /usr/bin/time -v python -m eval.run_arms_p2 run --shard ${{ matrix.i }}/6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p2-shard-${{ matrix.i }}
          path: |
            track_2a/results/eval2/shards/
            track_2a/data/model_cache/gguf_apertus-v1.5-8b-text-q4_k_m/
  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: pip install --require-hashes -r requirements.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: "p2-shard-*", merge-multiple: true, path: track_2a}
      - run: ls results/eval2/shards && find data/model_cache/gguf_apertus-v1.5-8b-text-q4_k_m -name '*.json' | wc -l
      - run: python -m eval.run_arms_p2 merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p2-8b
          path: |
            track_2a/results/eval2/p2__gguf_apertus-v1.5-8b-text-q4_k_m.json
            track_2a/results/eval2/hypotheses2__gguf_apertus-v1.5-8b-text-q4_k_m.json
            track_2a/results/eval2/shards/
            track_2a/data/model_cache/gguf_apertus-v1.5-8b-text-q4_k_m/
