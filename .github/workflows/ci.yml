name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: track_2a
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-fra tesseract-ocr-ita
      # hash-pinned like the image: requirements.lock (runtime + pytest) and requirements-dev.lock (ruff), sha256 per file
      - run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - run: ruff check src eval tests
      - run: PYTHONPATH=src:. python -m pytest -q
      - name: claims.tsv recomputed from results files
        run: PYTHONPATH=src:. python -m gegenprobe.claims check
      - name: data/ stays under the 100 MB limit
        run: test $(du -sm data | cut -f1) -le 100
  make-run:
    # the judges' path: clean checkout, Docker, CPU, no secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          set -o pipefail
          /usr/bin/time -v make run 2>&1 | tee make_run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: make-run, path: "track_2a/make_run.log\ntrack_2a/out/run_report.json"}
  systemd-units:
    # the deploy units as systemd itself parses them (unknown keys, bad paths, missing executables, broken dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: systemd-analyze verify (Docker variant and venv variant, each with its timer and failure notifier)
        run: |
          set -u
          systemd-analyze --version | head -1
          # the venv unit's interpreter lives in /opt on a real host; stand in the runner's python3 so verify can resolve it
          sudo install -d /opt/gegenprobe/.venv/bin
          sudo ln -sf "$(command -v python3)" /opt/gegenprobe/.venv/bin/python
          rc=0
          for variant in docker venv; do
            d=$(mktemp -d)
            cp deploy/nightly/gegenprobe-nightly-failure.service deploy/nightly/gegenprobe-nightly.timer "$d/"
            # install.sh installs either unit under the same name, gegenprobe-nightly.service (the timer activates it)
            if [ "$variant" = docker ]; then src=deploy/nightly/gegenprobe-nightly.service; else src=deploy/nightly/gegenprobe-nightly-venv.service; fi
            cp "$src" "$d/gegenprobe-nightly.service"
            r=0  # the step shell runs with -e: capture the exit code instead of aborting on the first variant
            out=$(SYSTEMD_UNIT_PATH="$d:" systemd-analyze verify --man=no "$d"/gegenprobe-nightly.service \
                  "$d"/gegenprobe-nightly-failure.service "$d"/gegenprobe-nightly.timer 2>&1) || r=$?
            echo "== $variant (exit $r)"; echo "$out"
            # exit code, plus any warning that names one of our units (systemd only warns on unknown keys)
            if [ $r -ne 0 ] || echo "$out" | grep -E "gegenprobe-nightly" | grep -qiE "unknown (key|section|lvalue)|ignoring|invalid|not executable|failed to"; then rc=1; fi
          done
          exit $rc
      - name: failure notifier under real systemd (no post for an alert night, one post per failure, valid JSON)
        run: |
          set -eu
          cat > /tmp/hook.py <<'PY'
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers["Content-Length"])).decode()
                  open("/tmp/posts", "a").write(body + "\n")
                  self.send_response(200); self.end_headers()
          http.server.HTTPServer(("127.0.0.1", 8765), H).serve_forever()
          PY
          touch /tmp/posts; python3 /tmp/hook.py & sleep 1
          sudo install -d -m 0700 /etc/gegenprobe
          echo "GP_ALERT_WEBHOOK=http://127.0.0.1:8765/hook" | sudo tee /etc/gegenprobe/alerts.env
          sudo cp deploy/nightly/gegenprobe-nightly-failure.service /etc/systemd/system/
          for code in 3 1; do  # stand-ins for the nightly unit: a night with alerts (3), a failed night (1)
            printf '[Unit]\nOnFailure=gegenprobe-nightly-failure.service\n[Service]\nType=oneshot\nExecStart=/bin/sh -c "exit %s"\n' \
              "$code" | sudo tee "/etc/systemd/system/gp-fake-$code.service" > /dev/null
          done
          sudo systemctl daemon-reload
          for code in 3 1; do
            sudo systemctl start "gp-fake-$code.service" || true
            for i in $(seq 30); do systemctl is-active -q gegenprobe-nightly-failure.service || break; sleep 1; done
            sleep 3
            sudo systemctl reset-failed "gp-fake-$code.service"  # one trigger source per notifier start
          done
          sudo journalctl -u gegenprobe-nightly-failure.service --no-pager -o cat
          cat /tmp/posts
          test "$(wc -l < /tmp/posts)" = 1
          python3 -c 'import json; t = json.loads(open("/tmp/posts").read())["text"]; print(t); assert "exit 1" in t'
  nightly-smoke:
    # the nightly job inside the built image, with the unit's container flags (read-only root, tmpfs /tmp, uid 10001,
    # no capabilities) and no network: three offline nights on fixture exports (gegenprobe.monitor.smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t gegenprobe:smoke .
      - name: three offline nights (quiet night, corrupt outbox, rate drop) in a read-only container
        run: |
          w=$(mktemp -d); chmod 0777 "$w"
          docker run --rm --name gegenprobe-nightly-smoke --network none \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --user 10001:0 --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 256 \
            -e GP_WORK=/var/gegenprobe/work -e GP_MONITOR_OUT=/var/gegenprobe/results \
            -v "$w:/var/gegenprobe/work" \
            gegenprobe:smoke python -m gegenprobe.monitor.smoke /var/gegenprobe/work/smoke
          cat "$w/smoke/results/run.json"
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0}
      - name: gitleaks (pinned binary, sha256-verified, full history)
        working-directory: .
        run: |
          # sha256 from the release's gitleaks_8.24.3_checksums.txt (github.com/gitleaks/gitleaks/releases/tag/v8.24.3)
          GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git -v --redact .
