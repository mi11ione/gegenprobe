name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: track_2a
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-fra tesseract-ocr-ita
      # hash-pinned like the image: requirements.lock (runtime + pytest) and requirements-dev.lock (ruff), sha256 per file
      - run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - run: ruff check src eval tests
      - run: PYTHONPATH=src:. python -m pytest -q
      - name: robots.txt under RFC 9309 in every process (src/sitecustomize.py; www4.ti.ch incident, docs/incidents.md)
        run: |
          PYTHONPATH=src:. python - <<'PY'
          import urllib.robotparser as r
          from gegenprobe import net
          assert r.RobotFileParser.can_fetch.__module__ == "_gegenprobe_robots9309", r.RobotFileParser.can_fetch.__module__
          rp = r.RobotFileParser()
          rp.parse(["User-agent: *", "Allow: /", "Disallow: /user_librerie/php/GC/allegato.php"])
          assert not rp.can_fetch(net.UA, "https://www4.ti.ch/user_librerie/php/GC/allegato.php?allid=115005")
          print("RFC 9309 robots.txt matching active")
          PY
      - name: claims.tsv recomputed from results files
        run: GP_CLAIMS_STRICT=1 PYTHONPATH=src:. python -m gegenprobe.claims check
      - name: 444_Report.pdf matches technical_report.md (every report anchor phrase in the PDF's text)
        run: PYTHONPATH=src:. python -m report.pdf_check
      - name: summary-number files regenerate byte-identical from committed inputs
        run: PYTHONPATH=src:. python -m report.numbers_step
      - name: data/ stays under the 100 MB limit (content size; small cache files would otherwise count as 4 KB blocks)
        run: test $(du -s --apparent-size --block-size=1M data | cut -f1) -le 100
  make-run:
    # the judges' path: clean checkout, Docker, CPU, no secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -o pipefail
          /usr/bin/time -v make run 2>&1 | tee make_run.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: make-run, path: "track_2a/make_run.log\ntrack_2a/out/run_report.json"}
  systemd-units:
    # the deploy units as systemd itself parses them (unknown keys, bad paths, missing executables, broken dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: systemd-analyze verify (Docker variant and venv variant, each with its timer and failure notifier)
        run: |
          set -u
          systemd-analyze --version | head -1
          # the venv unit's interpreter lives in /opt on a real host; stand in the runner's python3 so verify can resolve it
          sudo install -d /opt/gegenprobe/.venv/bin
          sudo ln -sf "$(command -v python3)" /opt/gegenprobe/.venv/bin/python
          rc=0
          for variant in docker venv; do
            d=$(mktemp -d)
            cp deploy/nightly/gegenprobe-nightly-failure.service deploy/nightly/gegenprobe-nightly.timer "$d/"
            # install.sh installs either unit under the same name, gegenprobe-nightly.service (the timer activates it)
            if [ "$variant" = docker ]; then src=deploy/nightly/gegenprobe-nightly.service; else src=deploy/nightly/gegenprobe-nightly-venv.service; fi
            cp "$src" "$d/gegenprobe-nightly.service"
            r=0  # the step shell runs with -e: capture the exit code instead of aborting on the first variant
            out=$(SYSTEMD_UNIT_PATH="$d:" systemd-analyze verify --man=no "$d"/gegenprobe-nightly.service \
                  "$d"/gegenprobe-nightly-failure.service "$d"/gegenprobe-nightly.timer 2>&1) || r=$?
            echo "== $variant (exit $r)"; echo "$out"
            # exit code, plus any warning that names one of our units (systemd only warns on unknown keys)
            if [ $r -ne 0 ] || echo "$out" | grep -E "gegenprobe-nightly" | grep -qiE "unknown (key|section|lvalue)|ignoring|invalid|not executable|failed to"; then rc=1; fi
          done
          exit $rc
      - name: systemd-analyze security exposure of both units (fails above the documented thresholds)
        run: |
          set -u
          # thresholds (0-10 scale; docs/runbook.md "Sandboxing"): venv unit 2.0 (the job itself runs in this sandbox),
          # Docker unit 5.0 (scores only the root docker client; the job's sandbox is the container flags)
          sudo install -d /opt/gegenprobe/.venv/bin
          sudo ln -sf "$(command -v python3)" /opt/gegenprobe/.venv/bin/python
          rc=0
          for variant in venv:20 docker:50; do
            name=${variant%%:*}; max=${variant##*:}
            d=$(mktemp -d)
            if [ "$name" = docker ]; then src=deploy/nightly/gegenprobe-nightly.service; else src=deploy/nightly/gegenprobe-nightly-venv.service; fi
            cp "$src" "$d/gegenprobe-nightly.service"
            r=0
            systemd-analyze security --offline=true --no-pager --threshold="$max" "$d/gegenprobe-nightly.service" \
              > "$d/out.txt" 2>&1 || r=$?
            cat "$d/out.txt"
            score=$(grep -o "Overall exposure level for [^:]*: [0-9.]*" "$d/out.txt" | grep -o "[0-9.]*$")
            echo "== $name: exposure ${score:-?} (threshold $((max / 10)).$((max % 10)), exit $r)"
            if [ $r -ne 0 ] || [ -z "$score" ]; then rc=1; fi
          done
          exit $rc
      - name: failure notifier under real systemd (no post for an alert night, one post per failure, valid JSON)
        run: |
          set -eu
          cat > /tmp/hook.py <<'PY'
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers["Content-Length"])).decode()
                  open("/tmp/posts", "a").write(body + "\n")
                  self.send_response(200); self.end_headers()
          http.server.HTTPServer(("127.0.0.1", 8765), H).serve_forever()
          PY
          touch /tmp/posts; python3 /tmp/hook.py & sleep 1
          sudo install -d -m 0700 /etc/gegenprobe
          echo "GP_ALERT_WEBHOOK=http://127.0.0.1:8765/hook" | sudo tee /etc/gegenprobe/alerts.env
          sudo cp deploy/nightly/gegenprobe-nightly-failure.service /etc/systemd/system/
          for code in 3 1; do  # stand-ins for the nightly unit: a night with alerts (3), a failed night (1)
            printf '[Unit]\nOnFailure=gegenprobe-nightly-failure.service\n[Service]\nType=oneshot\nExecStart=/bin/sh -c "exit %s"\n' \
              "$code" | sudo tee "/etc/systemd/system/gp-fake-$code.service" > /dev/null
          done
          sudo systemctl daemon-reload
          for code in 3 1; do
            sudo systemctl start "gp-fake-$code.service" || true
            for i in $(seq 30); do systemctl is-active -q gegenprobe-nightly-failure.service || break; sleep 1; done
            sleep 3
            sudo systemctl reset-failed "gp-fake-$code.service"  # one trigger source per notifier start
          done
          sudo journalctl -u gegenprobe-nightly-failure.service --no-pager -o cat
          cat /tmp/posts
          test "$(wc -l < /tmp/posts)" = 1
          python3 -c 'import json; t = json.loads(open("/tmp/posts").read())["text"]; print(t); assert "exit 1" in t'
  nightly-smoke:
    # the nightly job inside the built image, with the unit's container flags (read-only root, tmpfs /tmp, uid 10001,
    # no capabilities) and no network: three offline nights on fixture exports (gegenprobe.monitor.smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t gegenprobe:smoke .
      - name: robots.txt under RFC 9309 inside the image (src/sitecustomize.py via ENV PYTHONPATH)
        run: |
          docker run --rm --network none --read-only --user 10001:0 gegenprobe:smoke python -c '
          import urllib.robotparser as r
          rp = r.RobotFileParser(); rp.parse(["User-agent: *", "Allow: /", "Disallow: /user_librerie/php/GC/allegato.php"])
          assert r.RobotFileParser.can_fetch.__module__ == "_gegenprobe_robots9309"
          assert not rp.can_fetch("hackapertus-research/0.1", "https://www4.ti.ch/user_librerie/php/GC/allegato.php?allid=1")
          print("RFC 9309 robots.txt matching active in the image")'
      - name: three offline nights (quiet night, corrupt outbox, rate drop) in a read-only container
        run: |
          w=$(mktemp -d); chmod 0777 "$w"
          docker run --rm --name gegenprobe-nightly-smoke --network none \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --user 10001:0 --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 256 \
            -e GP_WORK=/var/gegenprobe/work -e GP_MONITOR_OUT=/var/gegenprobe/results \
            -v "$w:/var/gegenprobe/work" \
            gegenprobe:smoke python -m gegenprobe.monitor.smoke /var/gegenprobe/work/smoke
          cat "$w/smoke/results/run.json"
      - name: local exports (GP_EXPORTS_DIR, the "Inside OPD" setup) mounted read-only as the Docker unit mounts them
        run: |
          set -eu
          # fixture exports in files.openparldata.ch/exports layout, written by the image; then owned by root and
          # read-only, like OPD's own export directory (uid 10001 can read, not write)
          d="$RUNNER_TEMP/opd"; mkdir -p "$d"; chmod 0777 "$d"
          docker run --rm --network none --user 10001:0 -v "$d:/fx" gegenprobe:smoke \
            python -m gegenprobe.monitor.smoke exports-fixture /fx
          sudo chown -R root:root "$d/exports" && sudo chmod -R a+rX,a-w "$d/exports"
          w=$(mktemp -d); r=$(mktemp -d); chmod 0777 "$w" "$r"
          envf=$(mktemp)
          printf 'GP_EXPORTS_DIR=%s\nGP_BE_OGD_LOCAL=/fx/be_ogd\n' "$d/exports" > "$envf"
          GP_EXPORTS_DIR="$d/exports"
          # deploy/nightly/gegenprobe-nightly.service ExecStart (same flags, --env-file and read-only --mount), plus
          # --network none and the fixture's canton tables; the night is the unit's `nightly run` (network mode)
          docker run --rm --name gegenprobe-nightly-local --network none \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --user 10001:0 --cap-drop ALL --security-opt no-new-privileges \
            --memory 1g --memory-swap 1g --cpus 2 --pids-limit 256 \
            --env-file "$envf" \
            -e GP_WORK=/var/gegenprobe/work -e GP_MONITOR_OUT=/var/gegenprobe/results \
            -v "$w:/var/gegenprobe/work" \
            -v "$r:/var/gegenprobe/results" \
            --mount type=bind,source=${GP_EXPORTS_DIR},target=${GP_EXPORTS_DIR},readonly \
            -v "$d/be_ogd:/fx/be_ogd:ro" \
            gegenprobe:smoke python -m gegenprobe.monitor.nightly run
          cat "$r/run.json"
          docker run --rm --network none --user 10001:0 -v "$r:/out:ro" gegenprobe:smoke \
            python -m gegenprobe.monitor.smoke local-exports-check /out
  apply-be-postgres:
    # the Bern apply plan executed, unchanged, on a real PostgreSQL (gegenprobe.repair.apply_be_pg): before-state tables
    # rebuilt from the committed join, plan applied (exactly 2,975 rows changed, each to its planned value), re-run
    # (rolls back), and one perturbed row (full rollback, nothing changed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4-bookworm
        env: {POSTGRES_PASSWORD: gp-ci-only, POSTGRES_DB: gp}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env: {PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: gp-ci-only, PGDATABASE: gp}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: pip install --require-hashes -r requirements.lock
      - name: apply, re-run, perturbed doc, perturbed affair (exit 1 unless all four hold)
        run: |
          psql --version
          PYTHONPATH=src:. python -m gegenprobe.repair.apply_be_pg --out apply_BE_pg_check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: apply-be-postgres, path: track_2a/apply_BE_pg_check.json}
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: gitleaks (pinned binary, sha256-verified, full history)
        working-directory: .
        run: |
          # sha256 from the release's gitleaks_8.24.3_checksums.txt (github.com/gitleaks/gitleaks/releases/tag/v8.24.3)
          GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git -v --redact .
