name: gguf-8b
# Real Apertus v1.5 8B runs (GGUF Q4_K_M, llama.cpp CPU). Public AI's "-8b" name serves the 70B, so the 8B arms run here.
# Manual only. `selfcheck` validates the scorer against the spike's libllama reference; `arms` runs a frozen eval arm and
# uploads the hash-keyed model cache as an artifact (committed afterwards under data/model_cache/gguf_*).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "selfcheck | diag | impl | arms"
        default: selfcheck
      args:
        description: "extra args for the arms runner (e.g. --arm P8 --shard 0/4)"
        default: ""
permissions:
  contents: read
defaults:
  run:
    working-directory: track_2a
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GP_WORK: ${{ github.workspace }}/work
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: llama-cpp-python (CPU wheel, pinned)
        run: |
          pip install --require-hashes -r requirements.lock   # same pins as requirements.txt, sha256-verified
          pip install --only-binary=:all: --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python==0.3.35 \
            || CMAKE_ARGS="-DGGML_NATIVE=ON" pip install llama-cpp-python==0.3.35
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/work/models
          key: model-cache-apertus-8b-gguf-v1
      - name: fetch pinned GGUF (sha256-verified)
        run: python -c "from gegenprobe import llm; print(llm.fetch_gguf('apertus-v1.5-8b-text-q4_k_m'))"
      - name: selfcheck
        if: inputs.task == 'selfcheck'
        run: python -m gegenprobe.gguf_check out/gguf_parity.json
      - name: diag (spike libllama scorer on the same CPU)
        if: inputs.task == 'diag'
        run: |
          python -m gegenprobe.gguf_check out/gguf_parity.json || true
          git clone -q --depth 1 https://github.com/ggml-org/llama.cpp "$GP_WORK/llama.cpp"
          git -C "$GP_WORK/llama.cpp" rev-parse HEAD | tee out/llama_cpp_commit.txt
          cmake -S "$GP_WORK/llama.cpp" -B "$GP_WORK/lb" -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF > /dev/null
          cmake --build "$GP_WORK/lb" -j4 --target llama > /dev/null
          c++ -std=c++17 -O2 tools/llscore.cpp -I"$GP_WORK/llama.cpp/include" -I"$GP_WORK/llama.cpp/ggml/include" -L"$GP_WORK/lb/bin" -lllama -o "$GP_WORK/llscore"
          python -m gegenprobe.gguf_check diag-ids out/ids.txt
          LD_LIBRARY_PATH="$GP_WORK/lb/bin" "$GP_WORK/llscore" "$GP_WORK/models/apertus-v1.5-8b-text-q4_k_m.gguf" score < out/ids.txt > out/llscore_cpu.txt
          python -m gegenprobe.gguf_check diag-compare out/ids.txt out/llscore_cpu.txt out/gguf_parity.json | tee out/diag.txt
      - name: impl (same Q4_K_M file, three llama.cpp implementations, against bf16)
        if: inputs.task == 'impl'
        run: |
          set -e
          mkdir -p out
          python -m gegenprobe.gguf_check impl-ids out/impl_ids.txt
          python -m gegenprobe.gguf_check impl-mine out/impl_mine.json
          M="$GP_WORK/models/apertus-v1.5-8b-text-q4_k_m.gguf"
          build() {  # $1 = label, $2 = llama.cpp source dir
            cmake -S "$2" -B "$GP_WORK/b_$1" -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF > /dev/null
            cmake --build "$GP_WORK/b_$1" -j4 --target llama > /dev/null
            c++ -std=c++17 -O2 tools/llscore.cpp -I"$2/include" -I"$2/ggml/include" -L"$GP_WORK/b_$1/bin" -lllama -o "$GP_WORK/llscore_$1"
            LD_LIBRARY_PATH="$GP_WORK/b_$1/bin" "$GP_WORK/llscore_$1" "$M" score < out/impl_ids.txt > "out/impl_llscore_$1.txt"
          }
          git clone -q --depth 1 https://github.com/ggml-org/llama.cpp "$GP_WORK/lc_master"
          git -C "$GP_WORK/lc_master" rev-parse HEAD > out/impl_master_commit.txt
          build master "$GP_WORK/lc_master"
          pip download -q llama-cpp-python==0.3.35 --no-binary :all: --no-deps -d "$GP_WORK/sdist"
          tar xzf "$GP_WORK"/sdist/llama_cpp_python-0.3.35.tar.gz -C "$GP_WORK/sdist"
          build vendored "$GP_WORK/sdist/llama_cpp_python-0.3.35/vendor/llama.cpp"
          python -m gegenprobe.gguf_check impl-compare out/impl_mine.json llscore_master=out/impl_llscore_master.txt llscore_vendored=out/impl_llscore_vendored.txt out/gguf_impl.json
      - name: arms
        if: inputs.task == 'arms'
        run: python -m eval.run_arms --backend gguf ${{ inputs.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gguf-${{ inputs.task }}-${{ github.run_id }}
          path: |
            track_2a/out/
            track_2a/data/model_cache/gguf_apertus-v1.5-8b-text-q4_k_m/
